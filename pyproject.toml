[project]
name = "skills-profiles"
version = "0.1.0"
description = "Label agent skills collected by skills-sh-mirror with a closed domain taxonomy via Jev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

# There is no package to build or install: the scripts sit at the root, `just` is
# the entry point, and uv only has to resolve the dependencies above.
[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.18.0", "pytest>=9.1.1", "ruff>=0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# so `import jev` in the tests finds the script at the project root
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is a formatter concern; long doc/comment lines are kept
]

[tool.ruff.lint.isort]
known-first-party = ["jev", "index", "readme", "conftest"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["index.py", "jev.py", "readme.py", "stale.py"]
