name: invalidate

# Manual: drop cached outputs from the dist snapshot so a later `generate` run
# regenerates them. Two targeting modes, mutually exclusive:
#   prompts — fully invalidate a prompt's outputs (json + markdown + owned
#             assets) for every skill; invalidating `persona` also cascades to
#             its dependent `cover` recipe and picture
#   assets  — drop only the rendered assets a prompt owns (`cover` -> cover.png),
#             keeping every cached text: the next run re-renders the pictures
#             from the recipes already on disk, no LLM text work
# An optional `skills` filter restricts either mode to a few skills. Filling in
# nothing would mean "everything", which this workflow refuses - the CLI's --all
# confirmation is passed here, once a real target is given.

on:
  workflow_dispatch:
    inputs:
      prompts:
        description: Comma-separated prompt ids to invalidate fully (e.g. persona, tagline)
        default: ""
      assets:
        description: Comma-separated prompt ids whose assets only to drop (cover = cover images)
        default: ""
      skills:
        description: Optional comma-separated skill ids to restrict the invalidation to
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

jobs:
  invalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore dist snapshot (profiles + dataset)
        uses: ./.github/actions/restore-dist

      - name: Invalidate cached outputs
        run: |
          set -euo pipefail
          prompts="${{ inputs.prompts }}"
          assets="${{ inputs.assets }}"
          if [ -n "$prompts" ] && [ -n "$assets" ]; then
            echo "Fill in 'prompts' or 'assets', not both" >&2
            exit 1
          fi
          args=()
          if [ -n "$prompts" ]; then
            args+=(--prompts "$prompts")
          elif [ -n "$assets" ]; then
            args+=(--assets "$assets")
          fi
          if [ -n "${{ inputs.skills }}" ]; then
            IFS=',' read -ra skills <<< "${{ inputs.skills }}"
            for id in "${skills[@]}"; do
              [ -n "$id" ] && args+=(--skill "$id")
            done
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "Nothing to invalidate - fill in 'prompts', 'assets' or 'skills'" >&2
            exit 1
          fi
          # the inputs themselves are the confirmation the CLI asks --all for
          args+=(--all)
          uv run skills-profiles invalidate "${args[@]}"

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date-counter
