name: invalidate

# Manual: drop cached outputs from the dist snapshot so a later `generate` run
# regenerates them. A prompt goes together with everything derived from it:
# its DAG dependents (`persona` cascades to `cover`) and its registered assets
# (`cover` takes its cover.png along) — so `prompts=cover` re-does the image
# recipes and the pictures as one unit, and `prompts=persona` re-does every
# persona plus its cover.
# An optional `skills` filter restricts the invalidation to a few skills.
# Filling in nothing would mean "everything", which this workflow refuses - the
# CLI's --all confirmation is passed here, once a real target is given.

on:
  workflow_dispatch:
    inputs:
      prompts:
        description: Comma-separated prompt ids to invalidate (e.g. cover, persona, tagline)
        default: ""
      skills:
        description: Optional comma-separated skill ids to restrict the invalidation to
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

jobs:
  invalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore dist snapshot (profiles + dataset)
        uses: ./.github/actions/restore-dist

      - name: Invalidate cached outputs
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.prompts }}" ]; then
            args+=(--prompts "${{ inputs.prompts }}")
          fi
          if [ -n "${{ inputs.skills }}" ]; then
            IFS=',' read -ra skills <<< "${{ inputs.skills }}"
            for id in "${skills[@]}"; do
              [ -n "$id" ] && args+=(--skill "$id")
            done
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "Nothing to invalidate - fill in 'prompts' or 'skills'" >&2
            exit 1
          fi
          # the inputs themselves are the confirmation the CLI asks --all for
          args+=(--all)
          uv run skills-profiles invalidate "${args[@]}"

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date-counter
