name: sync

# Manual: refresh the upstream dataset and publish it.
#
# The snapshot is replaced wholesale, and the profiles whose source changed with it are retired
# here: `just refresh` compares the index that was published with the one the new snapshot brought,
# so a skill upstream rewrote is rebuilt by the next publish run instead of keeping a profile of
# text that is no longer there. A skill that vanished upstream keeps its profiles — they were paid
# for, and nothing is left to rebuild them from.
#
# No model calls and no credentials: this run only moves data.
#
# The `dist` branch is the single atomic snapshot — the profiles at its root, the dataset mirror
# under `cache/`, and a `latest` pointer naming the tag it was published as.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore the published snapshot (profiles + sources)
        uses: ./.github/actions/restore-dist

      - name: Refresh the dataset and retire what it invalidates
        run: just refresh

      - name: Rewrite the index
        run: just index

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date
