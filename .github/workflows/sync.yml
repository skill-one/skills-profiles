name: sync

# Manual: sync the upstream dataset and publish it.
#
# The snapshot is replaced wholesale, and the profiles whose source changed with it are retired
# here: `just sync` compares the catalog that was published with the one the new snapshot
# produces, so a skill upstream rewrote is rebuilt by the next publish run instead of keeping a
# profile of text that is no longer there. A skill that vanished upstream keeps its profiles — they
# were paid for, and nothing is left to rebuild them from.
#
# No model calls and no credentials: this run only moves data. `just sync` rewrites the catalog
# itself, because a sync moves the source layer under it.
#
# The `dist` branch is the single atomic snapshot — the skills at its root, the angles written
# about them beside them, and the catalog. dist is one orphan commit force-pushed per run and
# pinned by a `dist-<date>` tag - no history, no pointer file.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore the published snapshot (skills and the angles written about them)
        uses: ./.github/actions/restore-dist

      - name: Sync the dataset, retire what it invalidates, rewrite the catalog
        run: just sync

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date
