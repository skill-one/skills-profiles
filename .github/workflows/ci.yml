name: ci

# Every push and pull request: the pipeline is verified offline (no network, no
# credentials), so CI needs nothing but the dev dependencies. Lint and types run
# alongside the tests so a clean PR is a complete one.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The justfile is under test, not just used, so the suite needs the tool: without it
      # tests/test_just.py skips itself and the build goes unverified.
      - uses: extractions/setup-just@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest
