name: publish

# Manual: write the missing angles about the dataset already published in `dist`, and publish as
# `dist-<base>-N`, where base is the newest bare `dist-YYYY-MM-DD` sync tag (or today, when there is
# none) and N increments across that base's publishes.
#
# Three angles, chosen by `angle`: the domain labels (jev.py), the Chinese descriptions
# (translate.py), the Chinese SKILL.md pages (skill_zh.py), or `all` of them - in that order. Every
# run starts on a fresh runner, and
# `restore-dist` pulls the published tree back - the skills, the angles written about them, the
# mirror's own files and the catalog, in one request. The outputs are the cache (so `just` only
# fills what is missing) and the skills are what it builds from. This run never touches upstream:
# the dataset is exactly what the last `sync` published. `limit` counts work rather than positions
# - the next skills still missing that angle, in the catalog's order, most installed first - so
# repeated runs walk down the dataset instead of redoing the top of it. Asking for `replace` drops
# the chosen angle's outputs before building, when its taxonomy, prompts or shape changed.
#
# Repository configuration (Settings -> Secrets and variables -> Actions), mirroring a local
# `.env`: the two endpoints, their keys, and the knobs that are about an endpoint rather than the
# batch. Unset means unset - an empty value is ignored, so a missing variable falls back to the
# default instead of overriding it. A run without an angle's key fails every skill of that angle.
#
#   Secrets:   SKILLS_PROFILES_API_KEY, SKILLS_PROFILES_TRANSLATE_API_KEY
#   Variables: SKILLS_PROFILES_BASE_URL, SKILLS_PROFILES_MODEL,
#              SKILLS_PROFILES_TRANSLATE_BASE_URL, SKILLS_PROFILES_TRANSLATE_MODEL

on:
  workflow_dispatch:
    inputs:
      angle:
        description: Which angle to build
        type: choice
        options:
          - all
          - domain
          - translate
          - skill_zh
        default: all
      limit:
        description: How many skills to build this run (per angle)
        default: "10"
      jobs:
        description: Calls in flight at once
        default: "32"
      replace:
        description: Rebuild the chosen angle(s) from scratch (true drops their outputs first)
        default: "false"

permissions:
  contents: write

concurrency:
  group: publish-dist
  cancel-in-progress: false # never cancel a run that is about to push

env:
  # the two endpoints and how to talk to them; the batch's own tunables are `just` knobs instead
  SKILLS_PROFILES_API_KEY: ${{ secrets.SKILLS_PROFILES_API_KEY }}
  SKILLS_PROFILES_BASE_URL: ${{ vars.SKILLS_PROFILES_BASE_URL }}
  SKILLS_PROFILES_MODEL: ${{ vars.SKILLS_PROFILES_MODEL }}
  SKILLS_PROFILES_TRANSLATE_API_KEY: ${{ secrets.SKILLS_PROFILES_TRANSLATE_API_KEY }}
  SKILLS_PROFILES_TRANSLATE_BASE_URL: ${{ vars.SKILLS_PROFILES_TRANSLATE_BASE_URL }}
  SKILLS_PROFILES_TRANSLATE_MODEL: ${{ vars.SKILLS_PROFILES_TRANSLATE_MODEL }}
  # Per-skill failures are reported but do not stop the batch: successful outputs are published,
  # and the next run retries the skills whose files are still missing.
  #
  # The two log paths are supplied by CI. Locally they are optional; without them the batch keeps
  # the same partial-success behaviour but only the skill id is printed.
  # thinking is on by default for translation, so a call reasons before it answers and outruns the
  # client's own 20s timeout
  SKILLS_PROFILES_TIMEOUT: "120"

jobs:
  publish:
    runs-on: ubuntu-latest
    # with no pace the run is bounded by the work itself; every request is bounded on its own by
    # the client timeout, and 32 calls run at once
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Restore the published snapshot (angles + sources)
        uses: ./.github/actions/restore-dist

      # Outputs are the cache, so a published one is never rebuilt and a change to the taxonomy,
      # the prompts or the output shape has to say so. A run is a fresh runner plus what
      # `restore-dist` brings back, so an invalidation only survives by publishing.
      - name: Drop the chosen angles, when asked
        if: inputs.replace == 'true'
        shell: sh
        run: |
          case "${{ inputs.angle }}" in
            domain) just invalidate ;;
            translate) just invalidate-translate ;;
            skill_zh) just invalidate-skill-zh ;;
            all) just invalidate && just invalidate-translate && just invalidate-skill-zh ;;
          esac

      - name: Build the missing domain labels
        if: inputs.angle == 'all' || inputs.angle == 'domain'
        env:
          GEN_ERR_LOG: ${{ runner.temp }}/generation-errors.log
          FAIL_LOG: ${{ runner.temp }}/failed-skills.log
        run: just limit="${{ inputs.limit }}" jobs="${{ inputs.jobs }}"

      - name: Build the missing Chinese descriptions
        if: inputs.angle == 'all' || inputs.angle == 'translate'
        env:
          GEN_ERR_LOG: ${{ runner.temp }}/generation-errors.log
          FAIL_LOG: ${{ runner.temp }}/failed-skills.log
        run: just limit="${{ inputs.limit }}" jobs="${{ inputs.jobs }}" translate

      - name: Build the missing Chinese SKILL.md pages
        if: inputs.angle == 'all' || inputs.angle == 'skill_zh'
        env:
          GEN_ERR_LOG: ${{ runner.temp }}/generation-errors.log
          FAIL_LOG: ${{ runner.temp }}/failed-skills.log
        run: just limit="${{ inputs.limit }}" jobs="${{ inputs.jobs }}" skill-zh

      - name: Report partial results
        if: always()
        shell: bash
        run: |
          set -u
          failures="${RUNNER_TEMP}/failed-skills.log"
          errors="${RUNNER_TEMP}/generation-errors.log"
          if [ ! -s "$failures" ]; then
            echo "No per-skill failures."
            exit 0
          fi
          count=$(wc -l < "$failures" | tr -d ' ')
          {
            echo "## Partial publish"
            echo
            echo "- Failed skills: $count"
            echo "- Successful outputs are still indexed and published; missing skills are retried next run."
            echo
            echo "### Failed skills"
            echo '```text'
            cat "$failures"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Partial success: $count skill(s) failed; continuing to index and publish."
          if [ -s "$errors" ]; then
            echo "First 100 generation error lines:"
            sed -n '1,100p' "$errors"
          fi

      - name: Upload per-skill failure reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: generation-failures-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/failed-skills.log
            ${{ runner.temp }}/generation-errors.log
          if-no-files-found: ignore

      - name: Rewrite the index
        run: just index

      - name: Publish to dist
        uses: ./.github/actions/publish-dist
        with:
          tag-mode: date-counter
