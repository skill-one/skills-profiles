name: restore-dist
description: >-
  Pull the published `dist` branch back into the output directory: the skills, the angles written
  about them and the catalog, in one request. The branch is a single orphan snapshot (no history,
  no pointer file - only tags pin releases); this copies its tree as-is. No-op when the branch
  does not exist yet.

inputs:
  dir:
    description: The output root, mirrored from the branch root
    default: output

outputs:
  restored:
    description: "true when a dist branch was pulled back, false on a cold start"
    value: ${{ steps.r.outputs.restored }}

runs:
  using: composite
  steps:
    - id: r
      env:
        DIR: ${{ inputs.dir }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$DIR"
        tmp="${RUNNER_TEMP}/dist-restore"
        rm -rf "$tmp"
        mkdir -p "$tmp"
        if curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/dist" \
            -o "${RUNNER_TEMP}/dist.tar.gz" \
           && tar -xzf "${RUNNER_TEMP}/dist.tar.gz" -C "$tmp" --strip-components=1; then
          cp -a "$tmp/." "$DIR/"
          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Restored $(du -sh "$DIR" | cut -f1) of sources and angles"
        else
          echo "restored=false" >> "$GITHUB_OUTPUT"
          echo "No dist branch yet: starting from an empty $DIR/"
        fi
