name: restore-dist
description: >-
  Pull the published `dist` branch back into the output directory: the skills, the profiles written
  about them, the mirror's own files and the catalog, in one request. The branch-root `latest`
  pointer is left out — a publish rewrites it, and a run never reads it. No-op when the branch does
  not exist yet.

inputs:
  dir:
    description: The output root, mirrored from the branch root
    default: output

outputs:
  restored:
    description: "true when a dist branch was pulled back, false on a cold start"
    value: ${{ steps.r.outputs.restored }}

runs:
  using: composite
  steps:
    - id: r
      env:
        DIR: ${{ inputs.dir }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$DIR"
        tmp="${RUNNER_TEMP}/dist-restore"
        rm -rf "$tmp"
        mkdir -p "$tmp"
        if curl -fsSL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/dist" \
            -o "${RUNNER_TEMP}/dist.tar.gz" \
           && tar -xzf "${RUNNER_TEMP}/dist.tar.gz" -C "$tmp" --strip-components=1; then
          # the pointer is what a publish writes, not what a run reads: restoring it would let a
          # snapshot's own name ride into the next publish as if a run had produced it
          rm -f "$tmp/latest"
          cp -a "$tmp/." "$DIR/"
          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Restored $(du -sh "$DIR" | cut -f1) of profiles and sources"
        else
          echo "restored=false" >> "$GITHUB_OUTPUT"
          echo "No dist branch yet: starting from an empty $DIR/"
        fi
