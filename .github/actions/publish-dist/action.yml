name: publish-dist
description: >-
  Publish a local directory to the `dist` branch, prune history, and tag the
  release. `tag-mode: date` writes `dist-YYYY-MM-DD` (force-updated within a
  day, used by sync). `tag-mode: date-counter` writes `dist-<base>-N` where
  base is the newest bare date tag (or today, when none) and N increments
  across that base's publishes (used by generate). The branch root also gets a
  one-line `latest` pointer naming that tag — the same way upstream publishes
  its newest snapshot — and stats.json gets stamped with what only this step
  knows: `publishedAt` and the `upstream` mirror tag the bundled dataset came
  from. The run fails unless pointer, tag and HEAD agree, or a published
  snapshot lost its stamp. Nothing new (stamp aside) publishes nothing.

inputs:
  tag-mode:
    description: "'date' or 'date-counter'"
    required: true
  output-dir:
    description: Local directory whose contents become the dist branch root (profiles)
    default: output
  data-dir:
    description: >-
      Optional local directory (the dataset mirror, e.g. cache) published into
      dist under the same name, beside the profiles. Skipped when it is absent.
    default: cache
  retention:
    description: >-
      Time window for dist commits and tags, in GNU date syntax
      (e.g. "1 month", "30 days", "4 weeks"). The newest commit and the
      newest tag of each pattern are always kept, even when everything is
      older than the cutoff.
    default: 1 month
  token:
    description: GitHub token with contents:write
    default: ${{ github.token }}

outputs:
  tag:
    description: The tag that was pushed (empty when nothing changed)
    value: ${{ steps.publish.outputs.tag }}

runs:
  using: composite
  steps:
    - id: publish
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        DATA_DIR: ${{ inputs.data-dir }}
        TAG_MODE: ${{ inputs.tag-mode }}
        RETENTION: ${{ inputs.retention }}
      shell: bash
      run: |
        set -euo pipefail
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        dist="${RUNNER_TEMP}/dist"
        rm -rf "$dist"
        # Full history clone: the branch is pruned to the retention window, so it stays small
        if ! git clone --branch dist "$remote" "$dist" 2>/dev/null; then
          # first publish: the branch does not exist yet
          mkdir -p "$dist"
          git -C "$dist" init -q
          git -C "$dist" checkout -q -b dist
          git -C "$dist" remote add origin "$remote"
        fi
        find "$dist" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
        cp -a "${OUTPUT_DIR}/." "$dist/"
        # mirror the dataset (e.g. cache/skills-sh) beside the profiles, when present
        if [ -n "$DATA_DIR" ] && [ -d "$DATA_DIR" ] && [ -n "$(ls -A "$DATA_DIR" 2>/dev/null)" ]; then
          mkdir -p "$dist/$DATA_DIR"
          cp -a "${DATA_DIR}/." "$dist/$DATA_DIR/"
        fi
        cd "$dist"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        list_tags() {
          git ls-remote --tags origin 'refs/tags/dist-*' \
            | awk -F'refs/tags/' '{print $2}' | grep -v '\^{}' || true
        }
        bare_re='^dist-[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        suffixed_re='^dist-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$'

        # Compute the tag to push
        if [ "$TAG_MODE" = "date" ]; then
          tag="dist-$(date -u +%Y-%m-%d)"
          force=-f
        elif [ "$TAG_MODE" = "date-counter" ]; then
          # base = newest bare date tag (from the last sync), or today when none
          all=$(list_tags)
          base=$(echo "$all" | grep -E "$bare_re" | sort -Vr | head -1 | sed 's/^dist-//' || true)
          [ -z "$base" ] && base=$(date -u +%Y-%m-%d)
          # N = 1 + max existing suffix for that base (numeric sort, not lex)
          max_n=$(echo "$all" | grep -E "^dist-${base}-[0-9]+$" \
            | sed -E "s/^dist-${base}-//" | sort -n | tail -1 || true)
          tag="dist-${base}-$(( ${max_n:-0} + 1 ))"
          force=
        else
          echo "unknown tag-mode: $TAG_MODE" >&2
          exit 1
        fi

        # The version pointer, same idea as upstream's: one line at the branch
        # root naming this publish's tag. Written before the commit so the
        # snapshot and its name ship as one, and read by `sync` so a repeat sync
        # costs one tiny request instead of the whole branch.
        printf '%s\n' "$tag" > latest

        # Provenance, by contrast, is not a sibling pointer: it goes into
        # stats.json, so the one file a consumer already reads also tells it
        # which mirror tag to join hashes on and when the snapshot was published.
        # The ref is derived from the bundled dataset's own marker, so whichever
        # workflow publishes it cannot lag the data; empty when no dataset rides
        # along (then only `publishedAt` is stamped).
        marker=$(ls "${dist}/${DATA_DIR}"/*/SNAPSHOT.json 2>/dev/null | head -1 || true)
        upstream_ref=""
        if [ -n "$marker" ]; then
          upstream_ref=$(jq -r '.ref // empty' "$marker")
        fi

        # Nothing-new is judged on content, not on the stamp: the snapshot being
        # replaced already carries a publishedAt this run has not earned, so both
        # sides are compared with the stamped fields off.
        stats_core=""
        head_core=""
        if [ -f stats.json ]; then
          stats_core=$("${GITHUB_ACTION_PATH}/stamp-stats.sh" core stats.json)
          if git rev-parse -q --verify HEAD >/dev/null; then
            # best-effort: a previous snapshot with no readable stats.json is an
            # empty baseline, i.e. a difference — which is a publish, not an error
            head_core=$(git show HEAD:stats.json 2>/dev/null \
              | "${GITHUB_ACTION_PATH}/stamp-stats.sh" core - || true)
          fi
        fi

        git add -A
        if git diff --cached --quiet; then
          echo "Nothing new to publish"
          echo "tag=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The unrestricted compare above cannot call a stamp-only difference no-op
        # (the previous snapshot's stamp is inside the file it staged against), so
        # stats.json is weighed a second time with both stamps removed.
        if [ -n "$stats_core" ] && [ "$stats_core" = "$head_core" ] \
          && git diff --cached --quiet -- . ':(exclude)stats.json'; then
          echo "Nothing new to publish"
          echo "tag=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        if [ -n "$stats_core" ]; then
          # stamped into the tree, not staged over it: the snapshot must carry the
          # time and ref it was published with, since neither can be derived later
          "${GITHUB_ACTION_PATH}/stamp-stats.sh" stamp stats.json "$published_at" "$upstream_ref"
          git add stats.json
        fi
        git commit -q -m "profiles: ${GITHUB_RUN_ID} at ${published_at}"

        # Prune dist history by age. Author timestamps survive `rebase` (which
        # preserves %at) and the squashed root gets a fresh author date, so
        # %at is a stable "when was this snapshot published" signal.
        cutoff_epoch=$(date -u -d "${RETENTION} ago" +%s)
        cutoff_date=$(date -u -d "${RETENTION} ago" +%Y-%m-%d)

        # oldest commit whose author date is within the window; HEAD when none is
        keep_from=$(git log --reverse --format='%H %at' \
          | awk -v c="$cutoff_epoch" '$2 >= c { print $1; exit }')
        [ -z "$keep_from" ] && keep_from=$(git rev-parse HEAD)

        root=$(git rev-list --max-parents=0 HEAD)
        if [ "$keep_from" != "$root" ]; then
          new_root=$(git commit-tree "$keep_from^{tree}" \
            -m "$(git log -1 --format=%B "$keep_from")")
          git rebase -q --onto "$new_root" "$keep_from" dist
          git push --force origin dist
        else
          git push origin dist
        fi

        git tag $force "$tag" HEAD
        git push $force origin "refs/tags/${tag}"

        # The pointer is what consumers resolve, so it must name exactly the tag
        # that points at what was just published — never a tag this run did not
        # create, and never a commit other than HEAD.
        [ "$(git show HEAD:latest)" = "$tag" ] || {
          echo "latest holds '$(git show HEAD:latest)', expected '${tag}'" >&2
          exit 1
        }
        [ "$(git rev-parse "${tag}^{commit}")" = "$(git rev-parse HEAD)" ] || {
          echo "tag ${tag} does not point at the published snapshot HEAD" >&2
          exit 1
        }

        # And the stamp has to be inside the snapshot consumers pin to: a publish
        # that lost it would leave a freshness probe unable to tell two snapshots
        # apart, and a hash join unable to say which mirror version the profiles
        # describe. An empty ref means no `upstream` field, so the two sides are
        # compared as strings.
        if [ -n "$stats_core" ]; then
          raw=$(git show "${tag}:stats.json")
          served_at=$(jq -r '.publishedAt // empty' <<<"$raw")
          served_upstream=$(jq -r '.upstream // empty' <<<"$raw")
          [ "$served_at" = "$published_at" ] || {
            echo "published stats.json carries '${served_at}', expected '${published_at}'" >&2
            exit 1
          }
          [ "$served_upstream" = "$upstream_ref" ] || {
            echo "published stats.json upstream is '${served_upstream}', expected '${upstream_ref}'" >&2
            exit 1
          }
        fi

        # Prune: drop tags whose embedded date is older than the cutoff.
        # Always keep the newest of each pattern as a floor, so a repo that
        # has been dormant for > retention still exposes its latest snapshot.
        all=$(list_tags)
        cutoff_int=${cutoff_date//-/}
        newest_bare=$(echo "$all" | grep -E "$bare_re" | sort -Vr | head -1 || true)
        newest_suffixed=$(echo "$all" | grep -E "$suffixed_re" | sort -Vr | head -1 || true)
        for t in $(echo "$all" | grep -E "$bare_re" || true); do
          [ "$t" = "$newest_bare" ] && continue
          d_int=${t#dist-}; d_int=${d_int//-/}
          [ "$d_int" -lt "$cutoff_int" ] && git push origin --delete "refs/tags/$t"
        done
        for t in $(echo "$all" | grep -E "$suffixed_re" || true); do
          [ "$t" = "$newest_suffixed" ] && continue
          base=$(echo "$t" | sed -E 's/^dist-([0-9]{4}-[0-9]{2}-[0-9]{2})-[0-9]+$/\1/')
          d_int=${base//-/}
          [ "$d_int" -lt "$cutoff_int" ] && git push origin --delete "refs/tags/$t"
        done

        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "Published as \`${tag}\` (mode: ${TAG_MODE})" >> "$GITHUB_STEP_SUMMARY"
