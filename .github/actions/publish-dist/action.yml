name: publish-dist
description: >-
  Publish a local directory as the `dist` branch and tag the release, following skills-sh-mirror:
  every publish force-pushes one parentless (orphan) commit whose tree is exactly the snapshot, so
  dist carries no history - only the newest snapshot is reachable. `tag-mode: date` writes
  `dist-YYYY-MM-DD`, force-updated within a day; `tag-mode: date-counter` writes
  `dist-<base>-N`, where base is the newest bare `dist-YYYY-MM-DD` tag (or today, when there is
  none) and N increments across that base's publishes. There is no pointer file: the tags are the
  only pins, and tags older than `retention` are deleted on origin, which makes their orphan
  commits unreachable and keeps the repo bounded. Nothing new publishes nothing.

inputs:
  dir:
    description: Local directory whose contents become the dist branch root
    default: output
  tag-mode:
    description: "'date' or 'date-counter'"
    required: true
  retention:
    description: >-
      Age window to keep `dist-*` tags, in GNU date syntax (e.g. "1 month", "30 days",
      "4 weeks"). The newest tag of each pattern is always kept even when older than the cutoff.
    default: "1 month"
  token:
    description: GitHub token with contents:write
    default: ${{ github.token }}

outputs:
  tag:
    description: The tag that was pushed (empty when nothing changed)
    value: ${{ steps.publish.outputs.tag }}

runs:
  using: composite
  steps:
    - id: publish
      env:
        GH_TOKEN: ${{ inputs.token }}
        DIR: ${{ inputs.dir }}
        TAG_MODE: ${{ inputs.tag-mode }}
        RETENTION: ${{ inputs.retention }}
      shell: bash
      run: |
        set -euo pipefail
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        dist="${RUNNER_TEMP}/dist"
        rm -rf "$dist"

        # Stage the previous snapshot for the nothing-new diff. No clone fetches history beyond
        # the tip: the commit we publish is parentless regardless.
        if git clone --depth 1 --branch dist "$remote" "$dist" 2>/dev/null; then
          had_dist=1
        else
          had_dist=0
          mkdir -p "$dist"
          git -C "$dist" init -q
          git -C "$dist" remote add origin "$remote"
        fi

        # The published tree is exactly the snapshot directory - no pointer file, no metadata.
        find "$dist" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
        cp -a "${DIR}/." "$dist/"
        cd "$dist"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A

        # Nothing-new is judged against the previous tip: an identical tree costs no tag and no
        # force-push. On the first publish the index is non-empty by construction.
        if [ "$had_dist" = 1 ] && git diff --cached --quiet HEAD; then
          echo "Nothing new to publish"
          echo "tag=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        list_tags() {
          git ls-remote --tags origin 'refs/tags/dist-*' \
            | awk -F'refs/tags/' '{print $2}' | grep -v '\^{}' || true
        }
        bare_re='^dist-[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        suffixed_re='^dist-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$'
        today="$(date -u +%Y-%m-%d)"

        # Compute the tag to pin
        if [ "$TAG_MODE" = "date" ]; then
          tag="dist-${today}"
          force=-f
        elif [ "$TAG_MODE" = "date-counter" ]; then
          # base = newest bare date tag on origin (from the last sync), or today when none
          all_tags="$(list_tags)"
          base="$(echo "$all_tags" | grep -E "$bare_re" | sort -Vr | head -1 | sed 's/^dist-//' || true)"
          [ -z "$base" ] && base="$today"
          max_n="$(echo "$all_tags" | grep -E "^dist-${base}-[0-9]+$" \
            | sed -E "s/^dist-${base}-//" | sort -n | tail -1 || true)"
          tag="dist-${base}-$(( ${max_n:-0} + 1 ))"
          force=
        else
          echo "unknown tag-mode: $TAG_MODE" >&2
          exit 1
        fi
        published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # Replace the branch tip with one parentless commit holding exactly the staged tree.
        # Detach so the dist ref can be replaced, publish on an orphan branch, then rename it.
        if [ "$had_dist" = 1 ]; then
          git checkout -q --detach
          git branch -D -q dist
        fi
        git checkout -q --orphan dist
        git rm -rq --cached --ignore-unmatch . >/dev/null 2>&1 || true
        git add -A
        git commit -q -m "snapshot: run ${GITHUB_RUN_ID} at ${published_at}"
        git push -q --force origin dist

        # Pin this snapshot. Force for the bare date (a same-day rerun re-points it, a
        # non-fast-forward move to the orphan commit); the counter tag is new each run.
        if [ "$TAG_MODE" = "date" ]; then
          git push -q --force origin "HEAD:refs/tags/${tag}"
        else
          git push -q origin "HEAD:refs/tags/${tag}"
        fi

        # Prune tags older than the retention window. The newest of each pattern is a floor, so a
        # dormant repo still exposes its latest snapshot; today's tag is always kept. Deleting a
        # tag on origin makes its orphan commit unreachable - that is what keeps the repo bounded.
        cutoff_date=$(date -u -d "${RETENTION} ago" +%Y-%m-%d)
        cutoff_int=${cutoff_date//-/}
        all_tags="$(list_tags)"
        newest_bare="$(echo "$all_tags" | grep -E "$bare_re" | sort -Vr | head -1 || true)"
        newest_suffixed="$(echo "$all_tags" | grep -E "$suffixed_re" | sort -Vr | head -1 || true)"
        for t in $all_tags; do
          if echo "$t" | grep -qE "$bare_re"; then
            [ "$t" = "$newest_bare" ] && continue
            d_int=${t#dist-}
          elif echo "$t" | grep -qE "$suffixed_re"; then
            [ "$t" = "$newest_suffixed" ] && continue
            d_int=$(echo "$t" | sed -E 's/^dist-([0-9]{4}-[0-9]{2}-[0-9]{2})-[0-9]+$/\1/' | tr -d -)
          else
            continue
          fi
          [ "$d_int" -lt "$cutoff_int" ] && git push -q origin --delete "refs/tags/$t"
        done

        # Self-check: the published orphan tree is exactly the snapshot, and the tag resolves to it.
        [ "$(git rev-parse "${tag}^{commit}")" = "$(git rev-parse HEAD)" ] || {
          echo "tag ${tag} does not point at the published snapshot HEAD" >&2
          exit 1
        }
        if [ -n "$(git ls-tree --name-only HEAD -- latest)" ]; then
          echo "published tree unexpectedly contains a latest pointer" >&2
          exit 1
        fi

        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "Published as \`${tag}\` (mode: ${TAG_MODE}, orphan snapshot)" >> "$GITHUB_STEP_SUMMARY"
