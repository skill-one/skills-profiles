name: publish-dist
description: >-
  Publish a local directory as the `dist` branch, prune history by age, and tag the release.
  `tag-mode: date` writes `dist-YYYY-MM-DD`, force-updated within a day, so the bare date tag always
  names the newest publish of that day (used by sync). `tag-mode: date-counter` writes
  `dist-<base>-N`, where base is the newest bare date tag (or today, when there is none) and N
  increments across that base's publishes (used by publish). The branch root also gets a one-line
  `latest` pointer naming that tag — the same way upstream publishes its newest snapshot — and the
  run fails unless pointer, tag and HEAD agree. Nothing new publishes nothing: the tree is compared
  with the branch before a tag is chosen, so a run with nothing to show spends no version number.

inputs:
  dir:
    description: Local directory whose contents become the dist branch root
    default: output
  tag-mode:
    description: "'date' or 'date-counter'"
    required: true
  retention:
    description: >-
      Time window for dist commits and tags, in GNU date syntax (e.g. "1 month", "30 days",
      "4 weeks"). The newest commit and the newest tag of each pattern are always kept, even when
      everything is older than the cutoff.
    default: 1 month
  token:
    description: GitHub token with contents:write
    default: ${{ github.token }}

outputs:
  tag:
    description: The tag that was pushed (empty when nothing changed)
    value: ${{ steps.publish.outputs.tag }}

runs:
  using: composite
  steps:
    - id: publish
      env:
        GH_TOKEN: ${{ inputs.token }}
        DIR: ${{ inputs.dir }}
        TAG_MODE: ${{ inputs.tag-mode }}
        RETENTION: ${{ inputs.retention }}
      shell: bash
      run: |
        set -euo pipefail
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        dist="${RUNNER_TEMP}/dist"
        rm -rf "$dist"
        # Full history clone: the branch is pruned to the retention window, so it stays small
        if ! git clone --branch dist "$remote" "$dist" 2>/dev/null; then
          # first publish: the branch does not exist yet
          mkdir -p "$dist"
          git -C "$dist" init -q
          git -C "$dist" checkout -q -b dist
          git -C "$dist" remote add origin "$remote"
        fi
        find "$dist" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
        cp -a "${DIR}/." "$dist/"
        cd "$dist"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Nothing-new is judged before a tag is chosen: `latest` is the only file a publish writes
        # on its own, so the comparison leaves it out and a no-op run costs no version number.
        git add -A
        if git diff --cached --quiet -- . ':(exclude)latest'; then
          echo "Nothing new to publish"
          echo "tag=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        list_tags() {
          git ls-remote --tags origin 'refs/tags/dist-*' \
            | awk -F'refs/tags/' '{print $2}' | grep -v '\^{}' || true
        }
        bare_re='^dist-[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        suffixed_re='^dist-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$'

        # Compute the tag to push
        if [ "$TAG_MODE" = "date" ]; then
          tag="dist-$(date -u +%Y-%m-%d)"
          force=-f
        elif [ "$TAG_MODE" = "date-counter" ]; then
          # base = newest bare date tag (from the last sync), or today when none
          all=$(list_tags)
          base=$(echo "$all" | grep -E "$bare_re" | sort -Vr | head -1 | sed 's/^dist-//' || true)
          [ -z "$base" ] && base=$(date -u +%Y-%m-%d)
          # N = 1 + max existing suffix for that base (numeric sort, not lex)
          max_n=$(echo "$all" | grep -E "^dist-${base}-[0-9]+$" \
            | sed -E "s/^dist-${base}-//" | sort -n | tail -1 || true)
          tag="dist-${base}-$(( ${max_n:-0} + 1 ))"
          force=
        else
          echo "unknown tag-mode: $TAG_MODE" >&2
          exit 1
        fi

        # The version pointer, same idea as upstream's: one line at the branch root naming this
        # publish's tag. Written before the commit so the snapshot and its name ship as one.
        printf '%s\n' "$tag" > latest
        published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        git add latest
        git commit -q -m "snapshot: run ${GITHUB_RUN_ID} at ${published_at}"

        # Prune dist history by age. Author timestamps survive `rebase` (which preserves %at) and
        # the squashed root gets a fresh author date, so %at is a stable "when was this snapshot
        # published" signal.
        cutoff_epoch=$(date -u -d "${RETENTION} ago" +%s)
        cutoff_date=$(date -u -d "${RETENTION} ago" +%Y-%m-%d)

        # oldest commit whose author date is within the window; HEAD when none is
        # `|| true`: awk exits after the first match, so git log can die on a
        # later write (EPIPE -> SIGPIPE -> 141) once awk's read end is gone
        keep_from=$(git log --reverse --format='%H %at' \
          | awk -v c="$cutoff_epoch" '$2 >= c { print $1; exit }' || true)
        [ -z "$keep_from" ] && keep_from=$(git rev-parse HEAD)

        root=$(git rev-list --max-parents=0 HEAD)
        if [ "$keep_from" != "$root" ]; then
          new_root=$(git commit-tree "$keep_from^{tree}" \
            -m "$(git log -1 --format=%B "$keep_from")")
          git rebase -q --onto "$new_root" "$keep_from" dist
          git push --force origin dist
        else
          git push origin dist
        fi

        git tag $force "$tag" HEAD
        git push $force origin "refs/tags/${tag}"

        # The pointer is what consumers resolve, so it must name exactly the tag that points at
        # what was just published — never a tag this run did not create, and never another commit.
        [ "$(git show HEAD:latest)" = "$tag" ] || {
          echo "latest holds '$(git show HEAD:latest)', expected '${tag}'" >&2
          exit 1
        }
        [ "$(git rev-parse "${tag}^{commit}")" = "$(git rev-parse HEAD)" ] || {
          echo "tag ${tag} does not point at the published snapshot HEAD" >&2
          exit 1
        }

        # Prune: drop tags whose embedded date is older than the cutoff. Always keep the newest of
        # each pattern as a floor, so a repo dormant for longer than the window still exposes its
        # latest snapshot.
        all=$(list_tags)
        cutoff_int=${cutoff_date//-/}
        newest_bare=$(echo "$all" | grep -E "$bare_re" | sort -Vr | head -1 || true)
        newest_suffixed=$(echo "$all" | grep -E "$suffixed_re" | sort -Vr | head -1 || true)
        for t in $(echo "$all" | grep -E "$bare_re" || true); do
          [ "$t" = "$newest_bare" ] && continue
          d_int=${t#dist-}; d_int=${d_int//-/}
          [ "$d_int" -lt "$cutoff_int" ] && git push origin --delete "refs/tags/$t"
        done
        for t in $(echo "$all" | grep -E "$suffixed_re" || true); do
          [ "$t" = "$newest_suffixed" ] && continue
          base=$(echo "$t" | sed -E 's/^dist-([0-9]{4}-[0-9]{2}-[0-9]{2})-[0-9]+$/\1/')
          d_int=${base//-/}
          [ "$d_int" -lt "$cutoff_int" ] && git push origin --delete "refs/tags/$t"
        done

        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "Published as \`${tag}\` (mode: ${TAG_MODE})" >> "$GITHUB_STEP_SUMMARY"
